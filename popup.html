<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WooCommerce to Shopify</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Woo &rarr; Shopify</h1>
    <p class="subtitle">Scrape WooCommerce products &amp; export to Shopify CSV</p>

    <div id="status" class="status hidden"></div>

    <div class="section">
      <h2>Step 1: Scrape Products</h2>
      <p class="hint">Navigate to a WooCommerce shop/product page, then click scrape.</p>
      <div class="btn-row">
        <button id="btn-scrape-page" class="btn btn-primary">Scrape This Page</button>
        <button id="btn-scrape-all" class="btn btn-secondary">Scrape All Pages</button>
      </div>
    </div>

    <div class="section">
      <h2>Step 2: Review</h2>
      <div id="product-count" class="product-count">0 products scraped</div>
      <div id="product-list" class="product-list"></div>
    </div>

    <div class="section">
      <h2>Step 3: Export</h2>
      <div class="btn-row">
        <button id="btn-export" class="btn btn-success" disabled>Download Shopify CSV</button>
        <button id="btn-clear" class="btn btn-danger" disabled>Clear All</button>
      </div>
    </div>
  </div>
  <script src="shopify-csv.js"></script>
  <script src="popup.js"></script>
</body>
</html>
