services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reelay
      POSTGRES_PASSWORD: reelay
      POSTGRES_DB: reelay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelay"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/secrets:ro
      - media:/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
      - media:/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Chat-driven control layer. Opt-in: `docker compose --profile openclaw up`.
  # Needs ANTHROPIC_API_KEY + Telegram vars in .env.
  openclaw:
    build:
      context: .
      dockerfile: openclaw/Dockerfile
    profiles: ["openclaw"]
    env_file: .env
    environment:
      REELAY_API_BASE: http://api:8000
    volumes:
      - ./openclaw:/root/.openclaw
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  media:
