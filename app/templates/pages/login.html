{% extends "base.html" %}
{% block title %}Login - Threads Bot{% endblock %}
{% block body %}
<div class="min-h-full flex items-center justify-center py-12 px-4">
    <div class="glass rounded-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-brand-400 to-purple-400 bg-clip-text text-transparent">Threads Bot</h1>
            <p class="text-gray-500 text-sm mt-2">Sign in to your account</p>
        </div>
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/20 rounded-lg p-3 mb-4 text-red-400 text-sm">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-lg text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-lg text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
            </div>
            <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-500 rounded-lg font-medium transition">Sign In</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6">Don't have an account? <a href="/register" class="text-brand-400 hover:underline">Register</a></p>
    </div>
</div>
{% endblock %}
